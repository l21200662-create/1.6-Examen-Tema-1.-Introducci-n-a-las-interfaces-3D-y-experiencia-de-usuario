name: Publicar juego en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v6

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar únicamente los archivos del juego
        run: |
          mkdir -p sitio/assets
          cp index.html sitio/index.html
          cp -R assets/css assets/js assets/characters sitio/assets/

      - name: Cargar los archivos del sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: sitio

      - name: Publicar el sitio
        id: deploy
        uses: actions/deploy-pages@v4
